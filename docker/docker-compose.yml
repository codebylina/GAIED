# This file lives in GAIED/docker/.
# All commands are run from this docker/ folder.
#
# Start:  docker compose up -d redis ollama
#         docker compose exec ollama ollama pull qwen3.5:4b
#         docker compose run --rm gaied
# With MongoDB: add --profile mongo

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # on-disk persistence (AOF)
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  mongo:
    image: mongo:7
    profiles: ["mongo"]                                # started only with --profile mongo
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama-models:/root/.ollama]             # downloaded models are kept

  gaied:
    build: .
    user: root                                         # avoids permission issues on the mounted folder
    depends_on: [redis, ollama]
    working_dir: /app
    shm_size: 1gb
    environment:
      REDIS_HOST: redis
      # --- LLM choice: "ollama" (local) or "openai" (online API, key in docker/.env) ---
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}                   # empty = OLLAMA_MODEL below
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_SEND_TEMPERATURE: ${LLM_SEND_TEMPERATURE:-true}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:4b          # qwen3.5:9b with 16 GB of RAM or more
      OLLAMA_THINK: "false"             # thinking mode off: much faster on CPU
      NUM_PREDICT: "1024"
      SEEDS: "CNC(N)=O"                 # one agent per seed; "CNC(N)=O,CNC(N)=O" to test duplicates
      MAX_ITERATIONS: "3"
      N_XTB_WORKERS: "1"
      STABLE_REPORTS: "60"              # stop after 60 reports (30 min) without a new molecule: the LLM is slow on CPU
      FLOWCEPT_SETTINGS_PATH: /app/docker/flowcept_settings.yaml
      PYTHONPATH: /app:/app/docker                # so that local_llm.py is found
    volumes:
      - ..:/app                                   # the whole GAIED folder

volumes:
  redis-data:
  mongo-data:
  ollama-models:
